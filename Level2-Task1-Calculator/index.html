<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurelia | Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <main class="page">

        <header class="header">
            <div class="ornament">
                <span></span>
                <h1>Calculator</h1>
                <span></span>
            </div>
            <p>Elegant Digital Calculator</p>
        </header>

        <section class="calculator">

            <div class="calculator-top">
                <span>CALCULATOR</span>
                <div class="status-dot"></div>
            </div>

            <div class="display">
                <div class="expression" id="expression"></div>
                <div class="screen" id="display">0</div>
            </div>

            <div class="keys">

                <button class="key function" data-action="clear">AC</button>
                <button class="key function" data-action="delete">DEL</button>
                <button class="key operator" data-value="%">%</button>
                <button class="key operator" data-value="/">÷</button>

                <button class="key" data-value="7">7</button>
                <button class="key" data-value="8">8</button>
                <button class="key" data-value="9">9</button>
                <button class="key operator" data-value="*">×</button>

                <button class="key" data-value="4">4</button>
                <button class="key" data-value="5">5</button>
                <button class="key" data-value="6">6</button>
                <button class="key operator" data-value="-">−</button>

                <button class="key" data-value="1">1</button>
                <button class="key" data-value="2">2</button>
                <button class="key" data-value="3">3</button>
                <button class="key operator" data-value="+">+</button>

                <button class="key zero" data-value="0">0</button>
                <button class="key" data-value=".">.</button>
                <button class="key equal" data-action="calculate">=</button>

            </div>

        </section>

        <footer>
            <p>Designed & Developed by <strong>Maimoona Muskan</strong></p>
            <span>Oasis Infobyte · Web Development & Designing</span>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
